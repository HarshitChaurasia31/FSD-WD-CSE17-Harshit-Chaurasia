<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background: url("https://www.abes.ac.in/assets/2.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }
        nav{
            position: absolute;
            z-index: 1000;
            width: 100vw;
            box-shadow: 0 6px 9px 0 rgb(92, 92, 92);
        }
        .navigation {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 150px;
            background: linear-gradient(white,gainsboro,aliceblue);
            list-style: none;
            padding: 10px 70px 10px 70px;
            height: 60px;
        }
        li{
            border: 2px solid black;
            padding: 5px;
            border-radius: 7px;
        }
        li:hover{
            background-color: brown;
            color: white;
            transform: scale(1.2);
            transition: transform ease-in-out 0.1s;
            cursor: pointer;
        }
        a{
            color: black;
            text-decoration: none;
        }
        a:hover{
            color: white;
        }
    </style>
</head>

<body>
    <nav>
        <ul class="navigation">
            <li><a href="https://www.abes.ac.in/visionmission.html">About</a></li>
            <li><a href="https://www.abes.ac.in/academics/computer-science-engineering.html">Deparment</a></li>
            <li><a href="https://www.abes.ac.in/contact-us.html">Contact us</a></li>
        </ul>
    </nav>
</body>

</html>
